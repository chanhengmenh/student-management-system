# ─── SonarCloud Project Configuration ───────────────────────
# Replace YOUR_GITHUB_USERNAME with your actual GitHub username
# Replace YOUR_SONAR_ORG with your SonarCloud organization key

sonar.projectKey=YOUR_GITHUB_USERNAME_student-management-system
sonar.organization=YOUR_SONAR_ORG

sonar.projectName=Student Management System
sonar.projectVersion=1.0

# Source directories (all microservices + gateway)
sonar.sources=api-gateway,add-service,delete-service,update-service,search-service

# Exclude test files and node_modules from analysis
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/tests/**,**/*.test.js,**/*.spec.js

# Test directories
sonar.tests=add-service/tests

# JavaScript / Node.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
