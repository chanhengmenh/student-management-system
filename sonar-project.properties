# ─── SonarQube Project Configuration (self-hosted) ───────────
# sonar.host.url and sonar.token are passed via environment variables in CI

sonar.projectKey=student-management-system
sonar.projectName=Student Management System
sonar.projectVersion=1.0

# Source directories (all microservices + gateway)
sonar.sources=api-gateway,add-service,delete-service,update-service,search-service

# Exclude test files and node_modules from analysis
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/tests/**,**/*.test.js,**/*.spec.js

# Test directories
sonar.tests=add-service/tests

# JavaScript / Node.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
