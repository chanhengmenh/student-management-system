global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:

  # System metrics from the EC2 host
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway health (HTTP probe)
  - job_name: 'api-gateway'
    metrics_path: '/'
    static_configs:
      - targets: ['api-gateway:5000']
